<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#171719"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<meta name="referrer" content="no-referrer"/>
<title>Set New Password | Delux Opticals Owner Portal</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{font-family:'DM Sans',sans-serif;color:#241e21;background:#f6f4f3}*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:22px}main{width:min(445px,100%);background:white;border:1px solid #e9e1df;border-radius:17px;box-shadow:0 24px 70px #241c2120;overflow:hidden}.head{background:linear-gradient(130deg,#191719,#30272a);color:white;display:flex;align-items:center;gap:13px;padding:23px}.head img{width:45px;height:45px;object-fit:contain;border-radius:10px;border:1px solid #ffffff2e;padding:6px}.brand{font-family:Manrope,sans-serif;font-weight:800;letter-spacing:.08em;font-size:13px}.subbrand{font-size:10px;letter-spacing:.21em;color:#cabdc3;margin-top:5px;font-weight:700}.body{padding:31px}.kicker{font-size:10px;font-weight:800;letter-spacing:.16em;color:#a5212d}h1{font-family:Manrope,sans-serif;font-size:29px;line-height:1.2;letter-spacing:-1.15px;margin:12px 0}h1 span{color:#ed2635}p{font-size:13px;line-height:1.65;color:#737078;margin:8px 0 20px}label{font-size:12px;font-weight:700;display:block;margin-top:16px;margin-bottom:9px}input{font:14px 'DM Sans',sans-serif;background:#fbfaf9;border:1px solid #dbd6d6;border-radius:9px;display:block;width:100%;min-height:48px;padding:12px 13px;outline:none}input:focus{border-color:#e23540;box-shadow:0 0 0 3px #ed263516}button.primary,a.primary{display:block;background:#241e21;color:white;border:0;border-radius:9px;text-decoration:none;text-align:center;padding:14px 16px;font-size:13px;font-weight:750;width:100%;margin-top:23px;cursor:pointer}button.primary:hover,a.primary:hover{background:#ed2635}button:disabled{opacity:.56;cursor:wait}a.back{display:inline-block;margin-top:20px;color:#a5212d;text-decoration:none;font-size:12px;font-weight:700}a.back:hover{text-decoration:underline}.feedback{font-size:12px;line-height:1.6;margin-top:14px;color:#ac3138}.feedback.ok{color:#23663f}[hidden]{display:none!important}@media(max-width:480px){.body{padding:25px 22px}.head{padding:20px}}
</style>
</head>
<body>
<main>
 <div class="head"><img src="./delux-do-logo.svg" alt="Delux Opticals logo"/><div><div class="brand">DELUX OPTICALS</div><div class="subbrand">OWNER ACCOUNT</div></div></div>
 <div class="body">
  <div class="kicker">SECURE ACCOUNT RECOVERY</div>
  <h1>New password<span>.</span></h1>
  <p id="statusMessage" role="status" aria-live="polite">Verifying your password reset link…</p>
  <form id="resetForm" hidden>
   <label for="newPassword">New password</label><input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters" />
   <label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="10" required placeholder="Enter it again" />
   <p style="font-size:11px;margin:9px 0">Use at least 10 characters, including a letter and a number.</p>
   <button class="primary" type="submit">Update password →</button>
  </form>
  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
  <a class="back" id="returnToLogin" href="/owner.html">← Return to owner login</a>
 </div>
</main>
<script src="./config.js"></script>
<script type="module">
// Recovery tokens are short-lived. Supabase verifies the token, never this page itself.
const cfg=window.DELUXE_CONFIG||{};
const status=document.querySelector('#statusMessage');
const form=document.querySelector('#resetForm');
const feedback=document.querySelector('#feedback');
const entryHash=new URLSearchParams(location.hash.replace(/^#/,''));
const entryQuery=new URLSearchParams(location.search);
const intendedRecovery=entryHash.get('type')==='recovery'||entryQuery.has('code')||entryQuery.has('token_hash');
let db=null,allowUpdate=false,handledRecovery=false;
function problem(message){status.textContent=message;form.hidden=true;feedback.textContent=''}
async function validateRecovery(){
 if(handledRecovery)return;handledRecovery=true;
 try{
  const {data:{user},error:userError}=await db.auth.getUser();
  if(userError||!user)throw Error('This reset link could not be verified. Please request a fresh link.');
  const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
  if(error||!data){await db.auth.signOut();throw Error('This account does not have shop-owner access.');}
  allowUpdate=true;
  history.replaceState(null,'',location.pathname);
  status.textContent='Choose a strong new password to secure your owner account.';
  form.hidden=false;
  document.querySelector('#newPassword').focus();
 }catch(err){problem(err.message||'Could not verify this reset link.')}
}
try{
 if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Recovery service is unavailable. Please contact the site administrator.');
 if(entryQuery.get('error')||entryHash.get('error'))throw Error('This reset link has expired or is invalid. Please request a new one.');
 if(!intendedRecovery)throw Error('Open the recovery link from your email to set a new password.');
 const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.76.1');
 db=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true,flowType:'implicit'}});
 db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(()=>{void validateRecovery()},0)}});
 await db.auth.initialize();
 // A normal signed-in session is not permission to open this recovery screen.
 if(!handledRecovery){setTimeout(()=>{if(!handledRecovery)problem('The reset link could not be verified. Please request a new link from Owner Login.')},1800)}
}catch(err){problem(err.message||'Unable to process the password reset link.')}
form.addEventListener('submit',async(e)=>{
 e.preventDefault();if(!db||!allowUpdate)return;
 const next=document.querySelector('#newPassword').value;
 const confirm=document.querySelector('#confirmPassword').value;
 if(next!==confirm){feedback.textContent='Passwords do not match.';return}
 if(next.length<10||!/[A-Za-z]/.test(next)||!/\d/.test(next)){feedback.textContent='Use at least 10 characters with a letter and number.';return}
 const button=form.querySelector('button');button.disabled=true;button.textContent='Updating password…';feedback.textContent='';
 try{
  const {error}=await db.auth.updateUser({password:next});if(error)throw error;
  allowUpdate=false;await db.auth.signOut();
  form.reset();form.hidden=true;status.textContent='Password updated successfully. You can now sign in with your new password.';
  feedback.classList.add('ok');feedback.textContent='Your owner account is ready.';
 }catch(err){feedback.textContent=err.message||'Unable to update password. Request a new reset link if this one expired.'}
 finally{button.disabled=false;button.textContent='Update password →'}
});
</script>
</body>
</html>
